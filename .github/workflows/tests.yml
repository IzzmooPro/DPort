name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # DPort yalniz Windows'ta calisir; testler Win32 API'lerini kullanir.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10: README/Calistir.bat'in destekledigi en eski surum.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      # Installer (Inno Pascal) testleri derleyici olmadan sessizce atlanir;
      # derleyici bulunamazsa is acikca basarisiz olur.
      - name: Locate or install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe bulunamadi: $iscc" }
          "Inno Setup: " + (Get-Item $iscc).VersionInfo.ProductVersion
          "DPORT_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile sources
        run: python -m compileall -q app tests scripts packaging
      - name: Run tests
        run: python -m pytest -q
